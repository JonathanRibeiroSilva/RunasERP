services:
  # ============================================
  # NGINX REVERSE PROXY (Produção com SSL)
  # ============================================
  nginx-prod:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: erp-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend-prod
      - api-gateway-prod
    networks:
      - erp-network
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - letsencrypt-certs:/etc/letsencrypt:ro
      - letsencrypt-www:/var/www/certbot
      - nginx-logs:/var/log/nginx
    environment:
      - TZ=America/Sao_Paulo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "https://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ============================================
  # FRONTEND (Produção - Build Otimizado)
  # ============================================
  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
        - VITE_OAUTH_REDIRECT_URI=${FRONTEND_URL}/auth/callback
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
        - VITE_MICROSOFT_CLIENT_ID=${VITE_MICROSOFT_CLIENT_ID}
        - VITE_MICROSOFT_TENANT_ID=${VITE_MICROSOFT_TENANT_ID:-common}
    container_name: erp-frontend-prod
    networks:
      - erp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================================
  # API GATEWAY (Produção)
  # ============================================
  api-gateway-prod:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: erp-api-gateway-prod
    environment:
      DATABASE_URL: ${DATABASE_URL_GATEWAY}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      EMPRESAS_URL: ${EMPRESAS_URL:-http://empresas-prod:8007}
      CLIENTES_URL: ${CLIENTES_URL:-http://clientes-prod:8001}
      PRODUTOS_URL: ${PRODUTOS_URL:-http://produtos-prod:8002}
      ESTOQUE_URL: ${ESTOQUE_URL:-http://estoque-prod:8003}
      VENDAS_URL: ${VENDAS_URL:-http://vendas-prod:8004}
      FINANCEIRO_URL: ${FINANCEIRO_URL:-http://financeiro-prod:8005}
      NOTIFICACOES_URL: ${NOTIFICACOES_URL:-http://notificacoes-prod:8006}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@runas.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Runas ERP}
      FRONTEND_URL: ${FRONTEND_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - erp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # MICROSSERVIÇOS (Produção)
  # ============================================
  empresas-prod:
    build:
      context: ./services/empresas
      dockerfile: Dockerfile
    container_name: erp-empresas-prod
    environment:
      DATABASE_URL: ${DATABASE_URL_EMPRESAS}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - erp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  clientes-prod:
    build:
      context: ./services/clientes
      dockerfile: Dockerfile
    container_name: erp-clientes-prod
    environment:
      DATABASE_URL: ${DATABASE_URL_CLIENTES}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - erp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  produtos-prod:
    build:
      context: ./services/produtos
      dockerfile: Dockerfile
    container_name: erp-produtos-prod
    environment:
      DATABASE_URL: ${DATABASE_URL_PRODUTOS}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - erp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  estoque-prod:
    build:
      context: ./services/estoque
      dockerfile: Dockerfile
    container_name: erp-estoque-prod
    environment:
      DATABASE_URL: ${DATABASE_URL_ESTOQUE}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - erp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  vendas-prod:
    build:
      context: ./services/vendas
      dockerfile: Dockerfile
    container_name: erp-vendas-prod
    environment:
      DATABASE_URL: ${DATABASE_URL_VENDAS}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CLIENTES_URL: ${CLIENTES_URL:-http://clientes-prod:8001}
      PRODUTOS_URL: ${PRODUTOS_URL:-http://produtos-prod:8002}
      ESTOQUE_URL: ${ESTOQUE_URL:-http://estoque-prod:8003}
      VENDAS_URL: ${VENDAS_URL:-http://vendas-prod:8004}
      FINANCEIRO_URL: ${FINANCEIRO_URL:-http://financeiro-prod:8005}
      API_GATEWAY_URL: ${API_GATEWAY_URL:-http://api-gateway-prod:8000}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Runas ERP}
      API_BASE_URL: ${API_BASE_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN}
      MP_PUBLIC_KEY: ${MP_PUBLIC_KEY}
      MP_ENVIRONMENT: ${MP_ENVIRONMENT:-production}
      EVOLUTION_API_URL: ${EVOLUTION_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - erp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  financeiro-prod:
    build:
      context: ./services/financeiro
      dockerfile: Dockerfile
    container_name: erp-financeiro-prod
    environment:
      DATABASE_URL: ${DATABASE_URL_FINANCEIRO}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - erp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  notificacoes-prod:
    build:
      context: ./services/notificacoes
      dockerfile: Dockerfile
    container_name: erp-notificacoes-prod
    environment:
      DATABASE_URL: ${DATABASE_URL_NOTIFICACOES}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      EVOLUTION_URL: ${EVOLUTION_URL:-http://evolution-api:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-runas}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - erp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  letsencrypt-certs:
    external: true
  letsencrypt-www:
    driver: local
  nginx-logs:
    driver: local

networks:
  erp-network:
    external: true
    name: runaserp_erp-network
