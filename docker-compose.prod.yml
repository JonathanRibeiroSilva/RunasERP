# Production stack — pull only. This is the file Coolify reads on the VPS:
#   docker compose -f docker-compose.prod.yml up -d --wait
#
# No `build:` anywhere on purpose. The VPS is 1 vCPU / 4 GB and cannot build
# nine images without starving the running stack, so CI builds and pushes to
# ghcr and this host only ever pulls. Build sections live in
# docker-compose.build.yml, which only CI ever loads.
#
# No nginx-prod / no Let's Encrypt: TLS terminates at Cloudflare and traffic
# arrives through the tunnel, so this host needs no inbound ports at all.

# REGISTRY is overridable so a fork pushes to its own namespace. TAG pins a
# rollback to one commit — CI publishes every image as both :<sha> and :latest.
# A YAML anchor can't be spliced into a string, so the default is repeated.

x-limits: &limits
  resources:
    limits:
      cpus: '0.5'
      memory: 512M

x-service: &service
  restart: unless-stopped
  networks: [erp-network]
  deploy: *limits
  # :latest is a moving tag, and compose's default pull policy is "missing" —
  # it keeps whatever copy the host already has and never checks the registry
  # again. That is how a deploy came up on a fifteen-hour-old image minutes
  # after CI had published the new one, with nothing in either log to say so.
  pull_policy: always
  depends_on:
    db: {condition: service_healthy}
    # A healthy postgres is not a usable one here: every service issues
    # CREATE TABLE <schema>.<table> and SQLAlchemy never creates the schema.
    db-init: {condition: service_completed_successfully}
    redis: {condition: service_healthy}
    rabbitmq: {condition: service_healthy}

# Every service validates the JWT minted by the gateway, so SECRET_KEY is shared.
x-service-env: &service-env
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  RABBITMQ_URL: ${RABBITMQ_URL:?set RABBITMQ_URL in .env}
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
  TZ: America/Sao_Paulo

services:
  # ============================================
  # INFRASTRUCTURE
  # No host port mappings: nothing here is reachable from outside the network.
  # ============================================
  db:
    image: postgres:15-alpine
    container_name: erp-db-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-erp}
      TZ: America/Sao_Paulo
    # No /docker-entrypoint-initdb.d bind mount: Coolify copies the compose file
    # to /data/coolify/applications/<uuid>/ and nothing else, so the repo-relative
    # ./postgres/init-schemas.sql resolved to a path that did not exist. Docker
    # answers that by creating an empty DIRECTORY, and psql died with "could not
    # read from input file: Is a directory" — the cluster came up with only the
    # `public` schema and every CREATE TABLE failed. See db-init below.
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [erp-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp} -d ${POSTGRES_DB:-erp}"]
      # start_interval + start_period: os servicos dependem deste healthy,
      # entao o primeiro probe tem de ser rapido ou o deploy espera 60s.
      # Passado o boot, 60s — 1 vCPU nao aguenta 6 exec/min por container.
      start_interval: 5s
      start_period: 30s
      interval: 60s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        # Docker rejects a cpus limit above the host core count, so 1.5 would fail
        # to start on the 1 vCPU production VPS. Raise this only alongside the host.
        limits: {cpus: '1.0', memory: 1G}

  # A dump of the database before anything in this deploy can change it. Every
  # service runs `alembic upgrade head` on boot, and the deploy workflow's
  # rollback only swaps images back — it never undoes DDL. Until this existed
  # there was no backup of any kind: /data/coolify/backups was empty.
  #
  # It runs on every deploy because Coolify 4.3 stops and removes every container
  # of the app before `up -d`, so this one-shot always starts again.
  #
  # Fail-closed: db-init waits for it to exit 0, and every service waits for
  # db-init. A deploy that cannot back up does not migrate. The dump is written to
  # a temp name, checked with pg_restore --list, and only then renamed, so a
  # half-written file never looks like a good one.
  #
  # Absolute bind mount, not a named volume: Coolify rewrites the volumes section
  # and drops `external:` (db_data below is not protected the way it looks), but
  # passes bind mounts through untouched. Same disk as the database, so this
  # covers a bad migration or a bad write — NOT losing the VPS. Off-site is still
  # open.
  db-backup:
    image: postgres:15-alpine
    container_name: erp-db-backup-prod
    networks: [erp-network]
    restart: "no"
    depends_on:
      db: {condition: service_healthy}
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-erp}
    volumes:
      - /data/erp/backups:/backups
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        nome="/backups/erp-$$(date -u +%Y%m%dT%H%M%SZ).dump"
        pg_dump -Fc -f /backups/.parcial.dump
        pg_restore --list /backups/.parcial.dump >/dev/null
        mv /backups/.parcial.dump "$$nome"
        # ponytail: keeps the 14 most recent dumps. The database is 11 MB today;
        # revisit the count when a dump stops being small next to 30 GB free.
        ls -1t /backups/erp-*.dump | tail -n +15 | xargs -r rm -f
        echo "backup ok: $$nome ($$(du -h "$$nome" | cut -f1))"

  # Creates the per-service schemas. SQLAlchemy's create_all emits
  # CREATE TABLE <schema>.<table> but never CREATE SCHEMA, so without this every
  # service dies on first boot with `schema "vendas" does not exist`.
  #
  # Inline rather than mounting postgres/init-schemas.sql, for two reasons:
  # Coolify does not ship the repo to the VPS (see the note on db above), and
  # /docker-entrypoint-initdb.d runs once per volume — a schema added later would
  # need someone to remember to run SQL by hand. This is idempotent and runs on
  # every deploy. Keep the list in sync with postgres/init-schemas.sql, which is
  # still how dev seeds its schemas.
  db-init:
    image: postgres:15-alpine
    container_name: erp-db-init-prod
    networks: [erp-network]
    restart: "no"
    depends_on:
      db: {condition: service_healthy}
      # Nothing that can change the schema starts before the dump exists.
      db-backup: {condition: service_completed_successfully}
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-erp}
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        for s in gateway empresas clientes produtos estoque vendas financeiro notificacoes evolution; do
          psql -v ON_ERROR_STOP=1 \
            -c "CREATE SCHEMA IF NOT EXISTS $$s" \
            -c "GRANT ALL ON SCHEMA $$s TO \"$$PGUSER\"" \
            -c "ALTER DEFAULT PRIVILEGES IN SCHEMA $$s GRANT ALL ON TABLES TO \"$$PGUSER\"" \
            -c "ALTER DEFAULT PRIVILEGES IN SCHEMA $$s GRANT ALL ON SEQUENCES TO \"$$PGUSER\"" >/dev/null
        done
        # Auditoria: tabelas e funcao de trigger compartilhadas. Idempotente, roda
        # a cada deploy — as migrations por servico so fazem CREATE TRIGGER e
        # dependem desta funcao ja existir. Espelho de postgres/init-schemas.sql.
        psql -v ON_ERROR_STOP=1 >/dev/null <<'SQL'
        -- ==================== AUDITORIA (Fase 3.2) ====================
        -- Mora aqui, e não numa migration de serviço, porque a função de trigger é
        -- compartilhada: sete serviços com Alembic independente não têm ordem de boot
        -- garantida entre si, e este script roda antes de todos eles. As migrations por
        -- serviço só fazem CREATE TRIGGER apontando para esta função.
        -- Mantenha em sincronia com o db-init do docker-compose.prod.yml.

        -- Nível 1: trilha de intenção, gravada pelo middleware do gateway.
        CREATE TABLE IF NOT EXISTS gateway.auditoria (
            id BIGSERIAL PRIMARY KEY,
            usuario_id UUID,
            empresa_id INTEGER,
            metodo VARCHAR(10) NOT NULL,
            rota TEXT NOT NULL,
            payload JSONB,
            status_resposta INTEGER,
            criado_em TIMESTAMP NOT NULL DEFAULT now()
        );
        CREATE INDEX IF NOT EXISTS ix_auditoria_empresa_data
            ON gateway.auditoria (empresa_id, criado_em DESC);

        -- Nível 2: snapshot de estado. É o que torna o rollback possível — a trilha
        -- diz quem e quando, só o snapshot diz o quê.
        CREATE TABLE IF NOT EXISTS gateway.auditoria_registros (
            id BIGSERIAL PRIMARY KEY,
            schema_origem VARCHAR(63) NOT NULL,
            tabela VARCHAR(63) NOT NULL,
            registro_id TEXT,
            empresa_id INTEGER,
            operacao VARCHAR(10) NOT NULL,
            dados_antes JSONB,
            dados_depois JSONB,
            revertido_em TIMESTAMP,
            criado_em TIMESTAMP NOT NULL DEFAULT now()
        );
        CREATE INDEX IF NOT EXISTS ix_auditoria_reg_empresa_data
            ON gateway.auditoria_registros (empresa_id, criado_em DESC);
        CREATE INDEX IF NOT EXISTS ix_auditoria_reg_alvo
            ON gateway.auditoria_registros (schema_origem, tabela, registro_id);

        CREATE OR REPLACE FUNCTION gateway.auditar_registro() RETURNS trigger AS $$fn$$
        DECLARE
            antes JSONB;
            depois JSONB;
            ref JSONB;
        BEGIN
            IF TG_OP <> 'INSERT' THEN antes := to_jsonb(OLD); END IF;
            IF TG_OP <> 'DELETE' THEN depois := to_jsonb(NEW); END IF;
            ref := COALESCE(depois, antes);

            INSERT INTO gateway.auditoria_registros
                (schema_origem, tabela, registro_id, empresa_id, operacao, dados_antes, dados_depois)
            VALUES (
                TG_TABLE_SCHEMA,
                TG_TABLE_NAME,
                ref->>'id',
                -- empresas.empresas não tem coluna empresa_id: ela E a empresa.
                COALESCE(
                    (ref->>'empresa_id')::INTEGER,
                    CASE WHEN TG_TABLE_SCHEMA = 'empresas' THEN (ref->>'id')::INTEGER END
                ),
                TG_OP,
                antes,
                depois
            );
            RETURN NULL;  -- AFTER trigger: o valor de retorno é ignorado
        END;
        $$fn$$ LANGUAGE plpgsql;
        SQL
        echo "schemas ready"

  redis:
    image: redis:7-alpine
    container_name: erp-redis-prod
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks: [erp-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      # start_interval + start_period: os servicos dependem deste healthy,
      # entao o primeiro probe tem de ser rapido ou o deploy espera 60s.
      # Passado o boot, 60s — 1 vCPU nao aguenta 6 exec/min por container.
      start_interval: 5s
      start_period: 30s
      interval: 60s
      timeout: 3s
      retries: 5
    deploy: *limits

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: erp-rabbitmq-prod
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?set RABBITMQ_DEFAULT_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in .env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks: [erp-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      # start_interval + start_period: os servicos dependem deste healthy,
      # entao o primeiro probe tem de ser rapido ou o deploy espera 60s.
      # Passado o boot, 60s — 1 vCPU nao aguenta 6 exec/min por container.
      start_interval: 5s
      start_period: 30s
      interval: 60s
      timeout: 10s
      retries: 5
    deploy: *limits

  # ============================================
  # API GATEWAY — single entry point (auth + RBAC + proxy)
  # ============================================
  api-gateway-prod:
    <<: *service
    image: ${REGISTRY:-ghcr.io/jonathanribeirosilva/runaserp}/api-gateway:${TAG:-latest}
    container_name: erp-api-gateway-prod
    environment:
      <<: *service-env
      DATABASE_URL: ${DATABASE_URL_GATEWAY:?set DATABASE_URL_GATEWAY in .env}
      # Prova de origem interna, o MESMO valor nos 8
      # containers. Ver services/*/interno.py.
      SERVICO_INTERNO_TOKEN: ${SERVICO_INTERNO_TOKEN}
      # Escopo menor: so estes DOIS containers. Ver
      # services/empresas/routers/empresas.py:exigir_plataforma.
      PLATAFORMA_INTERNO_TOKEN: ${PLATAFORMA_INTERNO_TOKEN}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      EMPRESAS_URL: ${EMPRESAS_URL:-http://empresas-prod:8007}
      CLIENTES_URL: ${CLIENTES_URL:-http://clientes-prod:8001}
      PRODUTOS_URL: ${PRODUTOS_URL:-http://produtos-prod:8002}
      ESTOQUE_URL: ${ESTOQUE_URL:-http://estoque-prod:8003}
      VENDAS_URL: ${VENDAS_URL:-http://vendas-prod:8004}
      FINANCEIRO_URL: ${FINANCEIRO_URL:-http://financeiro-prod:8005}
      NOTIFICACOES_URL: ${NOTIFICACOES_URL:-http://notificacoes-prod:8006}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      # Sem estas duas, o seed nao cria super admin nenhum.
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-Plataforma}
      # Cobranca da plataforma: conta MP do dono, nao a do lojista.
      PLATAFORMA_MP_ACCESS_TOKEN: ${PLATAFORMA_MP_ACCESS_TOKEN}
      PLATAFORMA_JOB_TOKEN: ${PLATAFORMA_JOB_TOKEN}
      # Mesmo valor no vendas-prod: e o par que fecha
      # /auth/cliente/registrar-interno. Vazio dos dois lados = janela aberta,
      # so o X-Forwarded-For protegendo.
      REGISTRO_INTERNO_TOKEN: ${REGISTRO_INTERNO_TOKEN}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Runas ERP}
      FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      # O túnel é o único ingress e é o último a voltar: cloudflared espera
      # frontend healthy, que espera este healthy. Com interval 30s o primeiro
      # probe só acontece em t+30s, e a cadeia inteira custava ~90s de site fora
      # do ar por deploy. start_period não conta as falhas iniciais, então dá
      # para sondar de 5 em 5 sem marcar o container como unhealthy no boot.
      #
      # start_interval e o probe de boot; interval so vale depois de healthy.
      # Sondar de 5 em 5 para sempre custava 12 exec/min via dockerd nesta VPS
      # de 1 vCPU, e o daemon sozinho chegou a 89% de CPU. O deploy rapido so
      # precisa da cadencia curta ate o primeiro healthy — depois disso, 60s.
      start_interval: 5s
      interval: 60s
      # 60s, nao 30s: no deploy u143gkg9hauofqlaojmw0adz este container ficou
      # Started as 19:32:13.310 e Healthy as 19:32:44.315 — 31,0s, um segundo
      # depois do start_period antigo. Passado o start_period, interval 5s com
      # retries 3 significa que 15s de atraso o marcam unhealthy; ai o frontend
      # (que depende dele healthy) nunca sobe e o deploy falha de verdade. Numa
      # VPS de 1 vCPU subindo 14 containers ao mesmo tempo, 15s de variacao e
      # rotina. Falha dentro do start_period nao conta, entao a folga e de graca.
      start_period: 60s
      timeout: 10s
      retries: 3

  # ============================================
  # MICROSERVICES
  # ============================================
  empresas-prod:
    <<: *service
    image: ${REGISTRY:-ghcr.io/jonathanribeirosilva/runaserp}/empresas:${TAG:-latest}
    container_name: erp-empresas-prod
    environment:
      <<: *service-env
      DATABASE_URL: ${DATABASE_URL_EMPRESAS:?set DATABASE_URL_EMPRESAS in .env}
      # Prova de origem interna, o MESMO valor nos 8
      # containers. Ver services/*/interno.py.
      SERVICO_INTERNO_TOKEN: ${SERVICO_INTERNO_TOKEN}
      # Escopo menor: so estes DOIS containers. Ver
      # services/empresas/routers/empresas.py:exigir_plataforma.
      PLATAFORMA_INTERNO_TOKEN: ${PLATAFORMA_INTERNO_TOKEN}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 60s
      timeout: 10s
      retries: 3

  clientes-prod:
    <<: *service
    image: ${REGISTRY:-ghcr.io/jonathanribeirosilva/runaserp}/clientes:${TAG:-latest}
    container_name: erp-clientes-prod
    environment:
      <<: *service-env
      DATABASE_URL: ${DATABASE_URL_CLIENTES:?set DATABASE_URL_CLIENTES in .env}
      # Prova de origem interna, o MESMO valor nos 8
      # containers. Ver services/*/interno.py.
      SERVICO_INTERNO_TOKEN: ${SERVICO_INTERNO_TOKEN}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 60s
      timeout: 10s
      retries: 3

  produtos-prod:
    <<: *service
    image: ${REGISTRY:-ghcr.io/jonathanribeirosilva/runaserp}/produtos:${TAG:-latest}
    container_name: erp-produtos-prod
    environment:
      <<: *service-env
      DATABASE_URL: ${DATABASE_URL_PRODUTOS:?set DATABASE_URL_PRODUTOS in .env}
      # Prova de origem interna, o MESMO valor nos 8
      # containers. Ver services/*/interno.py.
      SERVICO_INTERNO_TOKEN: ${SERVICO_INTERNO_TOKEN}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 60s
      timeout: 10s
      retries: 3

  estoque-prod:
    <<: *service
    image: ${REGISTRY:-ghcr.io/jonathanribeirosilva/runaserp}/estoque:${TAG:-latest}
    container_name: erp-estoque-prod
    environment:
      <<: *service-env
      DATABASE_URL: ${DATABASE_URL_ESTOQUE:?set DATABASE_URL_ESTOQUE in .env}
      # Prova de origem interna, o MESMO valor nos 8
      # containers. Ver services/*/interno.py.
      SERVICO_INTERNO_TOKEN: ${SERVICO_INTERNO_TOKEN}
      PRODUTOS_URL: ${PRODUTOS_URL:-http://produtos-prod:8002}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 60s
      timeout: 10s
      retries: 3

  vendas-prod:
    <<: *service
    image: ${REGISTRY:-ghcr.io/jonathanribeirosilva/runaserp}/vendas:${TAG:-latest}
    container_name: erp-vendas-prod
    environment:
      <<: *service-env
      DATABASE_URL: ${DATABASE_URL_VENDAS:?set DATABASE_URL_VENDAS in .env}
      # Prova de origem interna, o MESMO valor nos 8
      # containers. Ver services/*/interno.py.
      SERVICO_INTERNO_TOKEN: ${SERVICO_INTERNO_TOKEN}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET}
      MP_PUBLIC_KEY: ${MP_PUBLIC_KEY}
      MP_ENVIRONMENT: ${MP_ENVIRONMENT:-production}
      # Cifra as credenciais de integracao por tenant (Mercado Pago incluso).
      # Vazia = vendas recusa gravar. Só era lida em notificacoes-prod antes;
      # é este serviço que grava/lê configuracoes_pagamento.
      INTEGRACOES_SECRET_KEY: ${INTEGRACOES_SECRET_KEY}
      API_BASE_URL: ${API_BASE_URL:?set API_BASE_URL in .env}
      FRONTEND_URL: ${FRONTEND_URL}
      # utils/tenant.py resolves the storefront slug against empresas; without
      # this the dev default (http://empresas:8007) fails DNS here and every
      # /loja/* request answers 500.
      EMPRESAS_URL: ${EMPRESAS_URL:-http://empresas-prod:8007}
      CLIENTES_URL: ${CLIENTES_URL:-http://clientes-prod:8001}
      PRODUTOS_URL: ${PRODUTOS_URL:-http://produtos-prod:8002}
      ESTOQUE_URL: ${ESTOQUE_URL:-http://estoque-prod:8003}
      FINANCEIRO_URL: ${FINANCEIRO_URL:-http://financeiro-prod:8005}
      API_GATEWAY_URL: ${API_GATEWAY_URL:-http://api-gateway-prod:8000}
      # Mesmo valor no api-gateway-prod: prova que o registrar-interno saiu daqui.
      REGISTRO_INTERNO_TOKEN: ${REGISTRO_INTERNO_TOKEN}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 60s
      timeout: 10s
      retries: 3

  financeiro-prod:
    <<: *service
    image: ${REGISTRY:-ghcr.io/jonathanribeirosilva/runaserp}/financeiro:${TAG:-latest}
    container_name: erp-financeiro-prod
    environment:
      <<: *service-env
      DATABASE_URL: ${DATABASE_URL_FINANCEIRO:?set DATABASE_URL_FINANCEIRO in .env}
      # Prova de origem interna, o MESMO valor nos 8
      # containers. Ver services/*/interno.py.
      SERVICO_INTERNO_TOKEN: ${SERVICO_INTERNO_TOKEN}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 60s
      timeout: 10s
      retries: 3

  notificacoes-prod:
    <<: *service
    image: ${REGISTRY:-ghcr.io/jonathanribeirosilva/runaserp}/notificacoes:${TAG:-latest}
    container_name: erp-notificacoes-prod
    environment:
      <<: *service-env
      DATABASE_URL: ${DATABASE_URL_NOTIFICACOES:?set DATABASE_URL_NOTIFICACOES in .env}
      # Prova de origem interna, o MESMO valor nos 8
      # containers. Ver services/*/interno.py.
      SERVICO_INTERNO_TOKEN: ${SERVICO_INTERNO_TOKEN}
      # evolution-api is not deployed (image pulled from Docker Hub); WhatsApp
      # calls fail closed until it returns. See docker-compose.cloudflare.yml.
      EVOLUTION_URL: ${EVOLUTION_URL:-http://evolution-api:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-runas}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 60s
      timeout: 10s
      retries: 3

  # ============================================
  # FRONTEND — built SPA, served by nginx inside the image
  # ============================================
  # VITE_* are baked into the bundle at build time, so the build args that make
  # this image environment-specific live in docker-compose.build.yml.
  frontend-prod:
    image: ${REGISTRY:-ghcr.io/jonathanribeirosilva/runaserp}/frontend:${TAG:-latest}
    container_name: erp-frontend-prod
    networks: [erp-network]
    restart: unless-stopped
    # Not covered by *service, so it needs its own — same moving-tag problem.
    pull_policy: always
    depends_on:
      api-gateway-prod: {condition: service_healthy}
    deploy: *limits
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to ::1 first and
      # gives up on "Connection refused" without falling back to IPv4. nginx:alpine
      # would normally add `listen [::]:80` through its 10-listen-on-ipv6-by-default
      # entrypoint script, but that script skips any conf.d file whose checksum
      # differs from the packaged one — which ours does. nginx serves fine on IPv4;
      # only the probe was looking at the wrong address.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      # Mesmo motivo do gateway: este é o elo do meio da cadeia até o túnel.
      # Idem: cadencia curta so no boot (start_interval), 60s depois de healthy.
      start_interval: 5s
      interval: 60s
      start_period: 30s
      timeout: 5s
      retries: 3

  # ============================================
  # CLOUDFLARE TUNNEL — the only ingress
  # ============================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: erp-cloudflared-prod
    # Token mode: no credentials file to mount, which a Coolify-managed deploy
    # cannot provide cleanly. Ingress is configured in the Cloudflare Zero Trust
    # dashboard:
    #   app.runaserp.com.br     -> http://frontend-prod:80
    #   coolify.runaserp.com.br -> http://host.docker.internal:8000
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in Coolify}
    # Coolify listens on the *host*, not on erp-network, so the tunnel needs a
    # route out of the bridge to reach it. This is what lets the deploy trigger
    # arrive over the tunnel instead of as an inbound connection to the VPS IP:
    # GitHub runners cannot reliably open one (see .github/workflows/deploy.yml),
    # but the tunnel is already dialled outbound and always up.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No depends_on, and note the absence of `pull_policy: always` — both are
    # deliberate, and both are the opposite of every service above. The tunnel is
    # the only ingress, so it has to outlive the containers it fronts. With
    # `frontend-prod: {condition: service_healthy}` here, recreating the frontend
    # recreated this too: the tunnel deregistered and Cloudflare served its own
    # 530 error page — no origin at all — and held it for the whole
    # api-gateway -> frontend healthcheck chain. Without it, the worst a deploy
    # can do is a 502 for the seconds the frontend container is missing, and
    # cloudflared re-resolves frontend-prod per request so nothing stays stuck.
    #
    # Cold boot pays for this with ~20s of 502 before the frontend exists. That
    # is already a full-stack outage, so it costs nothing that matters.
    networks: [erp-network]
    restart: unless-stopped
    deploy: *limits
    # Distroless image: no shell for a healthcheck. Verify with
    #   docker logs erp-cloudflared-prod | grep "Registered tunnel connection"

volumes:
  # Pinned names, not `<project>_db_data`. Coolify deploys under its own project
  # name, and a volume that inherits the project prefix would be a different
  # volume the day the project is renamed — Docker would helpfully create a new
  # empty one and the stack would come up looking like a fresh install.
  #
  # `external: true` on db_data means Compose neither creates nor deletes it:
  # `down -v` cannot reach it. Create it once, by hand:
  #     docker volume create runaserp_db_data
  db_data:
    name: runaserp_db_data
    external: true

  # Not external: redis is an LRU cache and rabbitmq's queues are rebuilt from
  # the database. Losing either costs a reconnect, not data — so they keep the
  # fixed name for predictability but stay under Compose's lifecycle.
  redis_data:
    name: runaserp_redis_data
  rabbitmq_data:
    name: runaserp_rabbitmq_data

networks:
  erp-network:
    name: runaserp_erp-network
