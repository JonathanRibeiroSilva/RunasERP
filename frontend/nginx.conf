# Serves the built SPA inside the frontend image (Dockerfile stage 2).
# Mirrors the Vite dev proxy: /api/* is stripped and forwarded to the gateway.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API Gateway is the single entry point. Trailing slash on proxy_pass strips
    # the /api prefix, matching vite.config.ts rewrite: path.replace(/^\/api/, '')
    location /api/ {
        proxy_pass http://api-gateway-prod:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Vite emits content-hashed filenames, so these are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # nginx só herda add_header do nível acima quando o nível atual não
        # declara nenhum — o Cache-Control acima apagava os três headers do
        # server para todo /assets/*, e o bundle ia sem nosniff. Dos três, só
        # esse vale para subrecurso: JS/CSS não é enquadrado nem envia referer.
        add_header X-Content-Type-Options nosniff always;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
