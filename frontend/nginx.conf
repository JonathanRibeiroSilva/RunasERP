# Serves the built SPA inside the frontend image (Dockerfile stage 2).
# Mirrors the Vite dev proxy: /api/* is stripped and forwarded to the gateway.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # style-src precisa de 'unsafe-inline': JSX usa style={{...}} em várias
    # páginas, e isso vira atributo style="" inline no DOM — sem a permissão o
    # CSP apaga esses estilos. script-src fica sem 'unsafe-inline'/'unsafe-eval':
    # esse é o que segura XSS de verdade, e o app não precisa de nenhum dos dois.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://viacep.com.br; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # API Gateway is the single entry point. The rewrite below strips the /api
    # prefix, matching vite.config.ts rewrite: path.replace(/^\/api/, '')
    location /api/ {
        # O gateway e recriado a cada deploy e ganha IP novo; o frontend so e
        # recriado quando a imagem dele muda. Com o hostname literal em
        # proxy_pass, o nginx resolve uma vez no boot e cacheia o IP para sempre
        # -- deploy p29ktqvytryu78w81d66l7jz trocou so o gateway e este nginx
        # ficou 20+ min proxiando para um container morto: / 200, /api/* 502.
        # Hostname numa variavel forca resolucao por requisicao, via o DNS
        # embutido do Docker. O rewrite volta a tirar o /api que o `/` no fim do
        # proxy_pass tirava -- com variavel, o nginx nao reescreve mais a URI.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gateway api-gateway-prod:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Vite emits content-hashed filenames, so these are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # nginx só herda add_header do nível acima quando o nível atual não
        # declara nenhum — o Cache-Control acima apagava os três headers do
        # server para todo /assets/*, e o bundle ia sem nosniff. Dos três, só
        # esse vale para subrecurso: JS/CSS não é enquadrado nem envia referer.
        add_header X-Content-Type-Options nosniff always;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    # O painel da plataforma só existe no subdomínio dele. O bundle já decide
    # isso pelo hostname (frontend/src/config/host.ts), mas isso é decisão de
    # cliente: sem o 404 aqui, /plataforma continua devolvendo o index.html em
    # app.*, e um 200 nessa URL já conta que o painel existe. ^admin\. espelha a
    # regra do front (primeiro rótulo do host) para não prender o domínio aqui.
    #
    # Não cobre /api/plataforma/*, que segue respondendo nos dois hosts atrás do
    # require_super_admin: o bloco /api/ teria de ser duplicado inteiro para
    # separar essa rota, e o ganho é menor que o do 404 acima.
    location /plataforma {
        if ($host !~ ^admin\.) {
            return 404;
        }
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
