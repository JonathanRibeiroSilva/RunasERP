
services:
  # Frontend development server
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: erp-frontend-dev
    ports:
      - "3000:3000"
    networks:
      - erp-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=50
      - VITE_HMR_HOST=localhost
      - VITE_HMR_PORT=3000
      - VITE_HMR_PROTOCOL=ws
      - VITE_API_URL=http://localhost:8000
      - VITE_OAUTH_REDIRECT_URI=http://localhost:3000/auth/callback
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
      - VITE_MICROSOFT_CLIENT_ID=${VITE_MICROSOFT_CLIENT_ID}
      - VITE_MICROSOFT_TENANT_ID=${VITE_MICROSOFT_TENANT_ID:-common}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Nginx reverse proxy
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: erp-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend-dev
    networks:
      - erp-network
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx
    environment:
      - TZ=America/Sao_Paulo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ngrok for public URL exposure
  ngrok:
    image: ngrok/ngrok:latest
    container_name: erp-ngrok
    command: http nginx:80
    ports:
      - "4040:4040"  # ngrok web interface
    depends_on:
      - nginx
    networks:
      - erp-network
    env_file:
      - .env.ngrok
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4040/api/tunnels"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  nginx-logs:
    driver: local

networks:
  erp-network:
    driver: bridge
