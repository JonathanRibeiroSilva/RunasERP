[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

markers =
    unit: Testes unitários
    integration: Testes de integração
    e2e: Testes end-to-end
    slow: Testes lentos
    auth: Testes de autenticação
    
addopts = -ra --strict-markers --tb=short --disable-warnings -v
testpaths = tests
