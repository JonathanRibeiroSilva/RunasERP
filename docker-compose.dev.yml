# Docker Compose para Desenvolvimento
# Baseado no docker-compose.yml principal, adaptado para desenvolvimento
# BuildKit habilitado para cache de pip (builds muito mais rápidos)

# Teto por container. Limite não reserva memória: só impede que um serviço em
# loop leve a máquina junto. db e frontend-dev sobrescrevem com valores maiores.
x-dev-limits: &dev-limits
  resources:
    limits:
      cpus: '0.5'
      memory: 512M

networks:
  erp-network:
    driver: bridge

volumes:
  pgadmin_data:
  rabbitmq_data:
  redis_data:
  db_data:

services:
  # ============================================
  # INFRAESTRUTURA
  # ============================================
  
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: erp-rabbitmq-dev
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - erp-network
    deploy: *dev-limits
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: erp-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - erp-network
    deploy: *dev-limits
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    command: redis-server --appendonly yes

  # ============================================
  # DATABASE (Consolidado com schemas)
  # ============================================

  db:
    image: postgres:15-alpine
    container_name: erp-db-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp}
      POSTGRES_DB: ${POSTGRES_DB:-erp}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./postgres/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql:ro
    networks:
      - erp-network
    deploy:
      resources:
        limits: {cpus: '1.0', memory: 1G}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  # ============================================
  # PGADMIN
  # ============================================

  # pgadmin:
  #  image: dpage/pgadmin4:latest
  #  container_name: erp-pgadmin-dev
  #  environment:
  #     PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@runas.com}
  #     PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
  #     PGADMIN_CONFIG_SERVER_MODE: 'False'
  #     PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
  #     PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
  #  ports:
  #    - "5050:80"
  # volumes:docker compose -f docker-compose.dev.yml -f docker-compose.cloudflare.yml --profile proxy up -d
  #    - pgadmin_data:/var/lib/pgadmin
  #    - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
  #    - ./pgadmin/pgpass:/tmp/pgpass:ro
  #  depends_on:
  #    - db
  #  networks:
  #    - erp-network
  #  healthcheck:
  #     test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/misc/ping"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #   entrypoint: >
  #     /bin/sh -c "
  #     mkdir -p /var/lib/pgadmin/storage/admin_runas.com &&
  #     cp /tmp/pgpass /var/lib/pgadmin/storage/admin_runas.com/pgpass &&
  #     chmod 600 /var/lib/pgadmin/storage/admin_runas.com/pgpass &&
  #     chown -R pgadmin:root /var/lib/pgadmin/storage &&
  #     /entrypoint.sh
  #     "

  # ============================================
  # EVOLUTION API (WhatsApp)
  # ============================================

  # Imagem atendai/evolution-api saiu do Docker Hub — fora do "up" padrão.
  # WhatsApp não é usado no fluxo da loja; reative com --profile whatsapp se voltar.
  evolution-api:
    image: atendai/evolution-api:latest
    container_name: erp-evolution-api-dev
    profiles:
      - whatsapp
    environment:
      # Database
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://erp:erp@db:5432/erp?schema=evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution_api
      DATABASE_ENABLED: "true"
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      # Redis Cache
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/2
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      # Authentication
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-change-me}
      # Server
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8080}
      DEL_INSTANCE: "false"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - erp-network
    deploy: *dev-limits
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # MICROSSERVIÇOS
  # ============================================

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: erp-api-gateway-dev
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL_GATEWAY}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      EMPRESAS_URL: ${EMPRESAS_URL:-http://empresas:8007}
      CLIENTES_URL: ${CLIENTES_URL:-http://clientes:8001}
      PRODUTOS_URL: ${PRODUTOS_URL:-http://produtos:8002}
      ESTOQUE_URL: ${ESTOQUE_URL:-http://estoque:8003}
      VENDAS_URL: ${VENDAS_URL:-http://vendas:8004}
      FINANCEIRO_URL: ${FINANCEIRO_URL:-http://financeiro:8005}
      NOTIFICACOES_URL: ${NOTIFICACOES_URL:-http://notificacoes:8006}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@runas.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Runas ERP}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api-gateway:/app
    networks:
      - erp-network
    deploy: *dev-limits
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-delay 2

  clientes:
    build:
      context: ./services/clientes
      dockerfile: Dockerfile
    container_name: erp-clientes-dev
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: ${DATABASE_URL_CLIENTES}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/clientes:/app
    networks:
      - erp-network
    deploy: *dev-limits
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8001 --reload --reload-delay 2

  produtos:
    build:
      context: ./services/produtos
      dockerfile: Dockerfile
    container_name: erp-produtos-dev
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: ${DATABASE_URL_PRODUTOS}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/produtos:/app
    networks:
      - erp-network
    deploy: *dev-limits
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8002 --reload --reload-delay 2

  estoque:
    build:
      context: ./services/estoque
      dockerfile: Dockerfile
    container_name: erp-estoque-dev
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: ${DATABASE_URL_ESTOQUE}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/estoque:/app
    networks:
      - erp-network
    deploy: *dev-limits
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8003 --reload --reload-delay 2

  vendas:
    build:
      context: ./services/vendas
      dockerfile: Dockerfile
    container_name: erp-vendas-dev
    ports:
      - "8004:8004"
    environment:
      DATABASE_URL: ${DATABASE_URL_VENDAS}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET}
      MP_PUBLIC_KEY: ${MP_PUBLIC_KEY}
      MP_ENVIRONMENT: ${MP_ENVIRONMENT:-sandbox}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CLIENTES_URL: ${CLIENTES_URL:-http://clientes:8001}
      PRODUTOS_URL: ${PRODUTOS_URL:-http://produtos:8002}
      ESTOQUE_URL: ${ESTOQUE_URL:-http://estoque:8003}
      FINANCEIRO_URL: ${FINANCEIRO_URL:-http://financeiro:8005}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/vendas:/app
    networks:
      - erp-network
    deploy: *dev-limits
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8004 --reload --reload-delay 2

  financeiro:
    build:
      context: ./services/financeiro
      dockerfile: Dockerfile
    container_name: erp-financeiro-dev
    ports:
      - "8005:8005"
    environment:
      DATABASE_URL: ${DATABASE_URL_FINANCEIRO}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/financeiro:/app
    networks:
      - erp-network
    deploy: *dev-limits
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8005 --reload --reload-delay 2

  notificacoes:
    build:
      context: ./services/notificacoes
      dockerfile: Dockerfile
    container_name: erp-notificacoes-dev
    ports:
      - "8006:8006"
    environment:
      DATABASE_URL: ${DATABASE_URL_NOTIFICACOES}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      EVOLUTION_URL: ${EVOLUTION_URL:-http://evolution-api:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-runas}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/notificacoes:/app
    networks:
      - erp-network
    deploy: *dev-limits
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8006 --reload --reload-delay 2

  empresas:
    build:
      context: ./services/empresas
      dockerfile: Dockerfile
    container_name: erp-empresas-dev
    ports:
      - "8007:8007"
    environment:
      DATABASE_URL: ${DATABASE_URL_EMPRESAS}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/empresas:/app
    networks:
      - erp-network
    deploy: *dev-limits
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8007 --reload --reload-delay 2

  # ============================================
  # FRONTEND
  # ============================================

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: erp-frontend-dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
      - /app/node_modules
    environment:
      # Defaults assume localhost — this file alone IS the local setup, no overlay
      # needed. docker-compose.cloudflare.yml overrides these with public URLs.
      # Após mexer no .env: docker compose up -d --force-recreate frontend-dev
      # NÃO use "docker restart" pois ele não relê o .env.
      VITE_API_URL: ${VITE_API_URL:-/api}
      VITE_OAUTH_REDIRECT_URI: ${VITE_OAUTH_REDIRECT_URI:-http://localhost:3000/auth/callback}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
      VITE_MICROSOFT_CLIENT_ID: ${VITE_MICROSOFT_CLIENT_ID}
      VITE_MICROSOFT_TENANT_ID: ${VITE_MICROSOFT_TENANT_ID:-common}
      # Chokidar: polling para watch funcionar no Docker/Windows
      # Intervalo aumentado para 1000ms reduz falsos positivos de mudança
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      # Vite proxy: habilitado para rotear /api/* para api-gateway:8000
      # Necessário porque removemos o nginx
      VITE_USE_PROXY: "true"
    depends_on:
      - api-gateway
    networks:
      - erp-network
    # Vite + HMR: o container mais pesado da stack.
    deploy:
      resources:
        limits: {cpus: '1.5', memory: 1536M}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    stdin_open: true
    tty: true
    restart: unless-stopped

  

