# Dependency updates. The CVE bumps in this repo were found by hand
# (c90fc31: python-multipart, python-jose, jinja2) — this is the automation
# that makes the next one arrive as a PR instead of a discovery.
#
# One grouped PR per ecosystem per week, not one per package: nine services
# sharing the same pins would otherwise open dozens of PRs nobody reviews.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}

  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly}
    groups:
      frontend: {patterns: ["*"]}
    # These two majors are migrations, not bumps, and one grouped PR fails as a
    # unit — riding along, they took 22 harmless updates down with them (#10).
    # TypeScript 7 is outside the peer range typescript-eslint declares
    # (<6.1.0), and ESLint 9 dropped .eslintrc for flat config. Each needs its
    # own PR; drop the entry once that PR lands.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  # Glob covers every service without a line per service — a new one under
  # services/ is picked up with no edit here.
  - package-ecosystem: pip
    directories:
      - /api-gateway
      - /services/*
      - /tests
    schedule: {interval: weekly}
    groups:
      python: {patterns: ["*"]}
    # bcrypt 5 took production login down: passlib 1.7.4 cannot detect a backend
    # past bcrypt 4.0, and the group PR carried the bump in with 26 harmless
    # ones. Drop this once passlib is replaced or reaches a release that
    # supports current bcrypt.
    ignore:
      - dependency-name: bcrypt
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
