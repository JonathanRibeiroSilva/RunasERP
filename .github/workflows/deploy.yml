name: Deploy

# Production deploys happen only from main. Developer is the integration branch;
# it reaches main through a pull request.
#
# Split of responsibility: this workflow produces and verifies images. Coolify owns
# the VPS and does the actual deploy: it is told to go once the images are proven.
#
#   test ──────┐   full CI (ci.yml), no image build: publish builds them
#   publish ───┴─► deploy   promote :<sha> to :latest, Coolify, health check
#
# test and publish run in parallel, and deploy waits for both. Nothing moves :latest
# (what Coolify and the build cache read) before the tests and the smoke test pass.
on:
  # Every merge to main ships. A PR into main runs no CI of its own: this pipeline is
  # the gate, so a promotion pays one full CI instead of two.
  #
  # The graphify workflow commits back to main with GITHUB_TOKEN, and a push made
  # with that token does not trigger workflows — a graph refresh never deploys.
  push:
    branches: [main]
    # None of these reach the running stack, and a deploy costs ~15 minutes of
    # rebuilding nine images plus a restart of production. Commit d3b79dd8 —
    # a one-line README edit — queued a full deploy; that is what this stops.
    # landing-page/ is excluded because it does not ship here at all: it is a
    # static site on Cloudflare Pages with its own workflow (landing.yml).
    #
    # .github/ is excluded for the same reason and a sharper one. PR #26 changed
    # 404.html, landing.yml and deploy.ps1 — nothing that runs in production —
    # and the deploy it triggered aborted mid-start, leaving the app down for 25
    # minutes. Coolify tears the old stack down before the new one is up, so
    # every deploy is an outage window; a deploy that cannot change the running
    # stack is that risk taken for nothing. Changing the deployment recipe is
    # not the same as changing the application, and workflow_dispatch below is
    # how you exercise a workflow change on purpose.
    #
    # docker-compose.prod.yml is deliberately NOT here: it lives at the repo
    # root, Coolify reads it, and a change to it must reach production.
    #
    # scripts/** is here on the same evidence: every build context is
    # ./api-gateway, ./services/* or ./frontend, and no Dockerfile copies from
    # scripts/ — so nothing in that directory can reach a running container. The
    # PR that added this line changed only .github/ and scripts/, and without it
    # would have bought a 15-minute rebuild and an outage window for files that
    # run on a laptop and a runner.
    paths-ignore:
      - 'landing-page/**'
      - 'docs/**'
      - '**.md'
      - '.github/**'
      - 'scripts/**'
  # Kept alongside the push trigger: a redeploy or a rollback should not require
  # inventing a commit. Leave `tag` empty and this tests and rebuilds the current
  # commit, exactly as a push does. Fill it with a sha already in ghcr and test and
  # publish are skipped: that sha is promoted to :latest, which is the only thing
  # Coolify looks at. That is the rollback.
  workflow_dispatch:
    inputs:
      tag:
        description: 'FULL sha (40 characters) already in ghcr to republish as :latest (empty = build this commit)'
        required: false
        default: ''
      # Pair it with `tag` = the live sha (scripts/production-sha.sh get): the first health check
      # asks for a path that does not exist, so the automatic rollback runs for real
      # while the stack is healthy.
      ensaio_rollback:
        description: 'rehearse the automatic rollback: the first health check is made to fail'
        type: boolean
        default: false

# A second push waits for the first instead of racing it to the registry.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  FILES: -f docker-compose.prod.yml -f docker-compose.build.yml

jobs:
  # The whole CI, whatever the diff touches: a merge to main is the last gate. The
  # images are built by `publish` below, so ci.yml is told not to build them twice.
  #
  # The permissions are what ci.yml asks of its own jobs. GitHub checks them when the
  # run opens, for every job of the called workflow, including `build`, which is
  # skipped here: without packages: read the whole run is refused at startup.
  test:
    if: ${{ !inputs.tag }}
    permissions:
      contents: read
      pull-requests: read
      packages: read
    uses: ./.github/workflows/ci.yml
    with:
      full: true
      build_images: false

  # The VPS is 1 vCPU / 4 GB — building nine images there would starve the running
  # stack, so the runner builds and the VPS only ever pulls.
  publish:
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      # Compose refuses to parse without the ${VAR:?} entries, and the frontend
      # bakes VITE_* into the bundle at build time — those values have to be
      # correct HERE, not just in Coolify. Coolify stays the source of truth for
      # everything read at runtime; this secret only has to cover the build.
      # The secret goes through env, not into the script text: `${{ }}` inside
      # `run:` is textual substitution.
      - name: Write build env
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
        run: printf '%s\n' "$PROD_ENV" > .env

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ponytail: cache_from in docker-compose.build.yml points every service at
      # the published :latest, and BUILDKIT_INLINE_CACHE=1 below is what writes
      # the metadata that makes those refs usable — drop the build arg and the
      # cache entries go silently dead. Together they keep the pip layer digest
      # stable across runs, which is what stops the VPS from re-pulling ~360 MB
      # of unchanged dependencies inside its own outage window: 2m39s of pulling,
      # 2m20s of it extraction, in deploy u6g9bhcoqgpxhhzel2thseg2 — for a commit
      # whose only change was one line of YAML.
      - name: Build the images
        run: docker compose $FILES build --build-arg BUILDKIT_INLINE_CACHE=1

      # Before the push on purpose: a green build only proves pip resolved the
      # requirements, so an image that cannot hash a password must not reach the
      # registry. The same script the PR gate runs.
      - name: Smoke-test auth primitives inside the built images
        run: bash scripts/ci-smoke-auth.sh .env api-gateway-prod vendas-prod

      # Only the sha tag. The production tag is promoted by the deploy job once the
      # tests are green, so a failed run leaves orphan sha tags in ghcr and nothing else.
      - name: Push the sha-tagged images
        run: docker compose $FILES push

  # Runs after both, and also when they were skipped (a rollback by `tag`): a status
  # function in `if` drops the implicit success() check, so a failed or cancelled
  # needs is asked for explicitly.
  #
  # The newest successful deployment of the `production` environment is the sha that last
  # passed the health check, i.e. what is live (scripts/production-sha.sh). It is written
  # only after a green health, and it is where the automatic rollback goes back to. Not a
  # git tag: GITHUB_TOKEN may not move one back to a commit with other workflows (card 114).
  deploy:
    needs: [test, publish]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      deployments: write
      packages: write
    env:
      TAG: ${{ inputs.tag || github.sha }}
      HEALTH_URL: https://app.runaserp.com.br/api/health/ready
    steps:
      # The images are tagged with the whole github.sha (publish), so a dispatch `tag`
      # is looked up verbatim. A short sha used to get through checkout, login and the
      # live-sha read and die in the promote with `not found` (card 115): refuse it
      # first, before anything touches ghcr. A push has no `tag`; its github.sha is
      # already complete, and the automatic rollback's LIVE is a recorded github.sha.
      - name: Check the tag is a full sha
        if: ${{ inputs.tag }}
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! $INPUT_TAG =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::tag must be the FULL sha, 40 lowercase hex characters (git rev-parse <ref>, or scripts/production-sha.sh get); got: $INPUT_TAG"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # `compose config --images` needs the ${VAR:?} entries to resolve, so the
      # promotion needs the build env too.
      - name: Write build env
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
        run: printf '%s\n' "$PROD_ENV" > .env

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Read before promoting: it has to be the sha that was live until now. Empty when
      # nothing was recorded yet (the first deploy after this was added).
      - name: Read the live sha
        id: live
        run: echo "sha=$(GH_TOKEN=${{ github.token }} bash scripts/production-sha.sh get)" >> "$GITHUB_OUTPUT"

      # Manifest-only copy inside ghcr: this is the moment the release goes live.
      - name: Promote the sha to latest
        id: promote
        run: bash scripts/promote-latest.sh "$TAG"

      # Coolify pulls the new images and restarts the stack. The secrets are read
      # from env by the script; see it for why COOLIFY_URL is a hostname.
      - name: Deploy through Coolify and wait for it
        id: coolify
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_UUID: ${{ secrets.COOLIFY_UUID }}
        run: bash scripts/coolify-deploy.sh

      # Coolify finishing says the containers were started, not that the app works.
      #
      # continue-on-error so the rollback step below can decide; the job still ends red
      # there. The rehearsal asks for a path that does not exist and gives up after one
      # attempt: a 404 will not turn into a 200 in three minutes.
      - name: Check production health
        id: health
        continue-on-error: true
        env:
          ENSAIO: ${{ inputs.ensaio_rollback }}
        run: |
          if [ "$ENSAIO" = true ]; then
            HEALTH_TENTATIVAS=1 bash scripts/health-ready.sh "$HEALTH_URL-ensaio-inexistente"
          else
            bash scripts/health-ready.sh "$HEALTH_URL"
          fi

      - name: Mark the sha as production
        if: steps.health.outcome == 'success'
        run: GH_TOKEN=${{ github.token }} bash scripts/production-sha.sh set "$TAG"

      # Puts the previous images back, unless that would be unsafe or impossible; see
      # scripts/rollback-decide.sh. The job ends red in every branch, because the
      # deploy it was asked to do did not happen.
      #
      # The diff is its own assignment on purpose: if it fails (the live sha is not in
      # the history), the step stops. Piping it straight into the script would hand it
      # an empty list, which reads as "no migration" and would roll back blind.
      - name: Automatic rollback
        if: steps.health.outcome == 'failure'
        env:
          LIVE: ${{ steps.live.outputs.sha }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_UUID: ${{ secrets.COOLIFY_UUID }}
        run: |
          arquivos=
          if [ -n "$LIVE" ]; then
            arquivos=$(git diff --name-only "$LIVE" "$TAG")
          fi
          decisao=$(printf '%s\n' "$arquivos" | bash scripts/rollback-decide.sh "$LIVE")
          case "$decisao" in
            sem-producao)
              echo "::error::no live sha recorded: automatic rollback disabled" ;;
            migration)
              echo "::error::a migration landed between $LIVE and $TAG: decide the rollback by hand" ;;
            reverter)
              if bash scripts/promote-latest.sh "$LIVE" \
                && bash scripts/coolify-deploy.sh \
                && bash scripts/health-ready.sh "$HEALTH_URL"; then
                echo "::error::deploy reverted to $LIVE"
              else
                echo "::error::rollback failed too: production is down"
              fi ;;
          esac
          exit 1
