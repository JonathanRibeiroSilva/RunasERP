name: Deploy

# Production deploys happen only from main. Developer is the integration branch;
# it reaches main through a pull request, which is where CI gates the change.
#
# Split of responsibility: this workflow only produces images. Coolify owns the
# VPS and does the actual deploy — it is told to go once the images are up.
on:
  # Every merge to main ships. The secrets this needs (PROD_ENV, COOLIFY_URL,
  # COOLIFY_TOKEN, COOLIFY_UUID) are configured, which is what kept this manual
  # before. CI gates the PR into main and this job rebuilds all nine images
  # itself, so a build that does not compile never reaches the registry.
  #
  # The graphify workflow commits back to main with GITHUB_TOKEN, and a push made
  # with that token does not trigger workflows — a graph refresh never deploys.
  push:
    branches: [main]
    # None of these reach the running stack, and a deploy costs ~15 minutes of
    # rebuilding nine images plus a restart of production. Commit d3b79dd8 —
    # a one-line README edit — queued a full deploy; that is what this stops.
    # landing-page/ is excluded because it does not ship here at all: it is a
    # static site on Cloudflare Pages with its own workflow (landing.yml).
    #
    # .github/ is excluded for the same reason and a sharper one. PR #26 changed
    # 404.html, landing.yml and deploy.ps1 — nothing that runs in production —
    # and the deploy it triggered aborted mid-start, leaving the app down for 25
    # minutes. Coolify tears the old stack down before the new one is up, so
    # every deploy is an outage window; a deploy that cannot change the running
    # stack is that risk taken for nothing. Changing the deployment recipe is
    # not the same as changing the application, and workflow_dispatch below is
    # how you exercise a workflow change on purpose.
    #
    # docker-compose.prod.yml is deliberately NOT here: it lives at the repo
    # root, Coolify reads it, and a change to it must reach production.
    paths-ignore:
      - 'landing-page/**'
      - 'docs/**'
      - '**.md'
      - '.github/**'
  # Kept alongside the push trigger: a redeploy or a TAG rollback should not
  # require inventing a commit.
  workflow_dispatch:

# A second push waits for the first instead of racing it to the registry.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  FILES: -f docker-compose.prod.yml -f docker-compose.build.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # Compose refuses to parse without the ${VAR:?} entries, and the frontend
      # bakes VITE_* into the bundle at build time — those values have to be
      # correct HERE, not just in Coolify. Coolify stays the source of truth for
      # everything read at runtime; this secret only has to cover the build.
      - name: Write build env
        run: |
          cat > .env <<'PROD_ENV_EOF'
          ${{ secrets.PROD_ENV }}
          PROD_ENV_EOF

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The VPS is 1 vCPU / 4 GB — building nine images there would starve the
      # running stack, so the runner builds and the VPS only ever pulls.
      # ponytail: cache_from in docker-compose.build.yml points every service at
      # the published :latest, and BUILDKIT_INLINE_CACHE=1 below is what writes
      # the metadata that makes those refs usable — drop the build arg and the
      # cache entries go silently dead. Together they keep the pip layer digest
      # stable across runs, which is what stops the VPS from re-pulling ~360 MB
      # of unchanged dependencies inside its own outage window: 2m39s of pulling,
      # 2m20s of it extraction, in deploy u6g9bhcoqgpxhhzel2thseg2 — for a commit
      # whose only change was one line of YAML.
      #
      # The first run after this lands still pays full price: it caches against a
      # :latest that was built without the metadata. The second run is the test.
      - name: Build and push images
        env:
          TAG: ${{ github.sha }}
        run: |
          docker compose $FILES build --build-arg BUILDKIT_INLINE_CACHE=1
          docker compose $FILES push

          # Coolify pulls :latest, so republish the same images under that tag.
          # The SHA tags stay in ghcr and are what a rollback points back at.
          docker compose $FILES config --images | grep '^ghcr\.io/' | while read -r img; do
            docker tag "$img" "${img%:*}:latest"
            docker push "${img%:*}:latest"
          done

      # Coolify pulls the new images and restarts the stack. It reads
      # docker-compose.prod.yml from this repo, which has no build sections —
      # so there is nothing it *can* build, only pull.
      #
      # COOLIFY_URL must be the Cloudflare hostname in front of the tunnel, not
      # the VPS IP. Pointing it at the IP asks a GitHub runner to open an
      # *inbound* connection to 187.127.10.108:8000, and that is a coin flip:
      # run 32047638162 got a reply in 0.5s, run 32048659255 fifteen minutes
      # later ate a 132s connect timeout — with the host idle, ufw disabled, no
      # fail2ban, port 8000 listening and zero kernel-level drops. The SYNs never
      # arrived. 187.127.0.0/18 is a block Hostinger only took over in 2025, and
      # reachability depends on which Azure egress the runner happens to land on.
      # Over the tunnel the VPS dials Cloudflare outbound and the runner only
      # ever talks to the anycast edge, which has no such problem.
      #
      # The retry is a seatbelt, not the fix: it turns one 132s hang into five
      # bounded attempts. Nothing reaches Coolify on a connect failure, so a
      # retried POST cannot double-queue a deploy.
      #
      # -A is not cosmetic: the zone has a WAF rule ("User-Agent suspeito")
      # that issues a managed challenge to any UA containing curl or wget.
      # Default curl sends `curl/8.x` and gets a 403 in 0.2s, from the edge,
      # with Cf-Mitigated: challenge — run 32058772049 died exactly there.
      # Same IP, same path, same method, only the UA changed: curl/8.5.0 -> 403,
      # anything Mozilla-ish -> 401 from Coolify. The edge is what answers.
      - name: Trigger Coolify deploy
        id: trigger
        run: |
          response="$(curl -fsS -X POST \
            --connect-timeout 10 --retry 5 --retry-delay 10 \
            -A 'Mozilla/5.0 (compatible; RunasDeploy/1.0; +github-actions)' \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            "${{ secrets.COOLIFY_URL }}/api/v1/deploy?uuid=${{ secrets.COOLIFY_UUID }}&force=false")"
          echo "$response"
          echo "uuid=$(printf '%s' "$response" | jq -r '.deployments[0].deployment_uuid')" >> "$GITHUB_OUTPUT"

      # Coolify answers as soon as it accepts the request, not when the stack is
      # up — without this step a deploy that never comes back is a green job.
      #
      # This used to poll the public /health URL, which Cloudflare answers by
      # itself: a datacenter IP gets a 403 that never reaches the VPS. The step
      # counted that 403 as a pass, so it verified nothing — every run that had
      # it (32029262468, 31853329182, 32047638162) burned the full 5 minutes on
      # 403s and went green without once seeing the stack. That was tolerable
      # while deploys were manual; on every merge to main it is a lie.
      #
      # Coolify's own deployment record is the check the edge cannot intercept:
      # same host, same token, already in hand — no WAF rule and no new secret.
      # It reports what actually happened on the VPS rather than what Cloudflare
      # felt like saying, and it fails loudly when the deploy fails.
      - name: Wait for Coolify to finish the deploy
        run: |
          uuid='${{ steps.trigger.outputs.uuid }}'
          if [ -z "$uuid" ] || [ "$uuid" = null ]; then
            echo "::error::no deployment_uuid in the trigger response"
            exit 1
          fi
          echo "polling deployment $uuid"
          # 90 x 10s = 15 min. A cold pull of all nine images has taken ~10.
          unreachable=0
          for _ in $(seq 90); do
            body="$(curl -fsS --connect-timeout 10 \
              -A 'Mozilla/5.0 (compatible; RunasDeploy/1.0; +github-actions)' \
              -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
              "${{ secrets.COOLIFY_URL }}/api/v1/deployments/$uuid")" || body=''
            status="$(printf '%s' "$body" | jq -r '.status // empty' 2>/dev/null)"
            # Losing the API mid-deploy is expected, not a failure. cloudflared
            # is a container in the very stack being deployed, so Coolify stops
            # the tunnel this request travels through; the edge then answers 530
            # for COOLIFY_URL until the new stack is up. Run 32060269768 polled
            # in_progress five times and then died on that 530 — it failed
            # because the deploy was working. Keep asking; only give up if the
            # tunnel never comes back, which means production is down anyway.
            if [ -z "$status" ]; then
              unreachable=$((unreachable + 1))
              echo "  unreachable ($unreachable)"
              # ~45 misses: each costs up to 10s of connect timeout plus the
              # 10s sleep, so this is roughly 10-15 minutes of silence.
              if [ "$unreachable" -ge 45 ]; then
                echo "::error::Coolify unreachable for ~15 min; last body: $body"
                exit 1
              fi
              sleep 10
              continue
            fi
            unreachable=0
            echo "  $status"
            case "$status" in
              finished|success) echo "deploy $uuid finished"; exit 0 ;;
              failed|error|cancelled*) echo "::error::deploy $uuid ended as $status"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::deploy $uuid still $status after 15 minutes"
          exit 1
