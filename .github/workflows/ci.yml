name: CI

on:
  pull_request:
    branches: [main, Developer]
  push:
    branches: [Developer]

jobs:
  # Catches the class of bug that shipped broken for months: a compose file
  # referencing services that don't exist, or a Dockerfile COPYing a missing file.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Each compose gets its own template: dev requires VITE_* that the
      # production one has no reason to carry, so a single shared .env fails one
      # of the two no matter which it is.
      - name: Validate compose (resolves env vars and service refs)
        run: |
          docker compose --env-file .env.production.example -f docker-compose.prod.yml config >/dev/null
          docker compose --env-file .env.example -f docker-compose.dev.yml config >/dev/null

      - name: Build all production images
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      # npm install, not ci: there is no package-lock.json committed yet.
      - run: npm install

      # The lint script pins --max-warnings to the count that existed when this
      # gate went in (all no-explicit-any). It blocks NEW warnings without
      # demanding the backlog be typed first; lower the number as it shrinks.
      - run: npm run lint
      - run: npm run build
      - run: npm run test -- --run

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - run: pip install -r tests/requirements.txt

      # Scoped to tests/unit by path, not by marker: several files directly under
      # tests/ are manual scripts that call a live localhost service and carry no
      # marker, so a marker filter still collects them and they fail with no stack up.
      # Exit 5 = "no tests collected", tolerated while tests/unit is still thin.
      - name: Unit tests
        run: pytest -c tests/pytest.ini tests/unit || [ $? -eq 5 ]
