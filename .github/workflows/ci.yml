name: CI

on:
  pull_request:
    branches: [main, Developer]
  # main is here too: a hotfix pushed straight to main skips the PR gate
  # otherwise, and main is what the deploy workflow builds from.
  push:
    branches: [main, Developer]
    # Só no push: um PR continua rodando o gate inteiro, aconteça o que
    # acontecer no diff. Aqui o que se evita é rebuildar nove imagens por um
    # commit que não pode quebrar nenhuma delas — c26e51e, só README, gastou
    # o ciclo completo. Mesma lista do deploy.yml MENOS .github/**: uma
    # mudança em workflow não muda o que roda em produção, mas muda o que a
    # CI faz, e essa é a única chance de validá-la fora de um PR.
    paths-ignore:
      - 'landing-page/**'
      - 'docs/**'
      - '**.md'
  # Lets migration-replay (below) run on demand, to pay off a check that was
  # skipped for four waves before it existed — see that job's comment.
  workflow_dispatch: {}

jobs:
  # Catches the class of bug that shipped broken for months: a compose file
  # referencing services that don't exist, or a Dockerfile COPYing a missing file.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Each compose gets its own template: dev requires VITE_* that the
      # production one has no reason to carry, so a single shared .env fails one
      # of the two no matter which it is.
      - name: Validate compose (resolves env vars and service refs)
        run: |
          docker compose --env-file .env.production.example -f docker-compose.prod.yml config >/dev/null
          docker compose --env-file .env.example -f docker-compose.dev.yml config >/dev/null

      # docker-compose.prod.yml is pull-only; the build sections it needs come
      # from docker-compose.build.yml, same pair the deploy workflow uses.
      - name: Build all production images
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml -f docker-compose.build.yml build

      # A green build only proves pip resolved the requirements — it never runs
      # a line of the app. bcrypt 5.0 installed perfectly and then broke every
      # login on the first request, because passlib could not read its version
      # and hash() started rejecting a 9-character password as "longer than 72
      # bytes". Nothing in CI called hash(), so it shipped.
      #
      # This runs the real primitive inside the real image with the real pins.
      # Both services that authenticate get it: the gateway for operators, and
      # vendas for storefront customers.
      #
      # ponytail: covers password hashing only, because that is what broke and
      # what a dependency bump can break without failing the build. Widen it the
      # next time a bump reaches production through the same blind spot.
      - name: Smoke-test auth primitives inside the built images
        run: |
          # Kept on one line per statement: python -c does not dedent, so an
          # indented block here is an IndentationError, not a test.
          check='from passlib.context import CryptContext; ctx = CryptContext(schemes=["bcrypt"], deprecated="auto"); h = ctx.hash("smoke-test-123"); assert ctx.verify("smoke-test-123", h), "rejected the correct password"; assert not ctx.verify("wrong", h), "accepted a wrong password"; print("auth primitives ok")'
          # docker run, not compose run: compose wants the service's external
          # volumes to exist before it starts anything, and this needs no
          # network, no database and no volume — just the interpreter inside the
          # image. The tag still comes from the compose config, so REGISTRY and
          # TAG stay defined in one place.
          for svc in api-gateway-prod vendas-prod; do
            echo "== $svc"
            img="$(docker compose --env-file .env.production.example \
              -f docker-compose.prod.yml -f docker-compose.build.yml \
              config --format json \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['services']['$svc']['image'])")"
            docker run --rm --entrypoint python "$img" -c "$check"
          done

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: '22'}

      # npm ci, not install: package-lock.json is committed, so the build is
      # reproducible and a lockfile that drifts from package.json fails here
      # instead of resolving to something nobody tested.
      - run: npm ci

      # The lint script pins --max-warnings to the count that existed when this
      # gate went in (all no-explicit-any). It blocks NEW warnings without
      # demanding the backlog be typed first; lower the number as it shrinks.
      - run: npm run lint
      - run: npm run build
      - run: npm run test -- --run

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}

      - run: pip install -r tests/requirements.txt

      # Scoped to tests/unit by path, not by marker: several files directly under
      # tests/ are manual scripts that call a live localhost service and carry no
      # marker, so a marker filter still collects them and they fail with no stack up.
      # No exit-5 tolerance: an empty tests/unit means the gate is not a gate.
      - name: Unit tests
        run: pytest -c tests/pytest.ini tests/unit

  # The job above reads source; this one runs it. One leg per service, each from
  # its own directory: the services import flat (`from main import app`,
  # `from config import settings`), so two of them in one pytest process fight
  # over which `main` sits on sys.path first.
  services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        svc:
          - api-gateway
          - services/clientes
          - services/empresas
          - services/estoque
          - services/financeiro
          - services/notificacoes
          - services/produtos
          - services/vendas
    services:
      postgres:
        image: postgres:15-alpine
        env: {POSTGRES_USER: erp, POSTGRES_PASSWORD: erp, POSTGRES_DB: erp}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp -d erp"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://erp:erp@localhost:5432/erp
      REDIS_URL: redis://localhost:6379/15
      RABBITMQ_URL: amqp://guest:guest@localhost:5672/
      SECRET_KEY: ci-only-secret-key-for-tests-min-32-chars
      PGPASSWORD: erp
      # Only the gateway reads these, but its alembic/env.py imports the settings,
      # so they must exist before the migration step, not just inside pytest.
      CLIENTES_URL: http://localhost:8001
      PRODUTOS_URL: http://localhost:8002
      ESTOQUE_URL: http://localhost:8003
      VENDAS_URL: http://localhost:8004
      FINANCEIRO_URL: http://localhost:8005
      NOTIFICACOES_URL: http://localhost:8006
      EMPRESAS_URL: http://localhost:8007
    defaults:
      run: {working-directory: '${{ matrix.svc }}'}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}

      # The service's own pins, not a test-only list: the point is to run the code
      # against the versions the image ships.
      - run: pip install -r requirements.txt -r "$GITHUB_WORKSPACE/tests/requirements.txt"

      # What db-init does in production before any service boots: schemas, grants,
      # and the shared audit function the 2026-08-28 revisions attach triggers to.
      - name: Schemas (db-init)
        run: psql -h localhost -U erp -d erp -v ON_ERROR_STOP=1 -q -f "$GITHUB_WORKSPACE/postgres/init-schemas.sql"

      # The whole chain against an empty database. Production was stamped at a
      # baseline and never did this; without this step the first to try would be
      # a new VPS, with the container dying on boot.
      - name: Migrations from an empty database
        run: alembic upgrade head

      - name: Tests
        run: pytest tests -p no:cacheprovider

  # The job above proves each service's migration chain replays from zero —
  # but against its OWN throwaway Postgres, one per matrix leg. Prod is not
  # that: it is ONE Postgres with all 7 service schemas in it (plus the
  # gateway's), the exact shape docker-compose.dev.yml builds. Two things only
  # that shape can catch: revisions from different services racing to touch a
  # SHARED object (trg_auditoria, created once and attached to 8 tables across
  # services — services/empresas/database.py's incident comment is what this
  # guards against happening again) and a break in the real boot path, which
  # is a subprocess call (services/*/database.py: init_db(), check=True) —
  # not the bare `alembic upgrade head` the job above runs directly.
  #
  # This is the check the plan called "fim de cada onda: down -v e subir do
  # zero" and named as skipped for four waves running — a manual step nobody
  # remembered. Automating it here is the fix for THAT, not just for the
  # migrations. Runs on push (not on every PR commit, to keep review cycles
  # fast) and on workflow_dispatch, to pay off the four waves' backlog on
  # demand without waiting for the next push.
  migration-replay:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7

      # frontend-dev and evolution-api are left out on purpose: neither talks
      # to Postgres, so neither says anything about migrations replaying —
      # frontend-dev alone would add ~1.5GB of the runner's memory for zero
      # signal. db, redis and rabbitmq aren't named: each service's depends_on
      # already pulls them in, same as `docker compose up` would with no args.
      #
      # --wait replaces a hand-rolled poll loop with the one docker compose
      # already ships: it blocks until every started container reports
      # healthy, or fails at the timeout. A service whose migration crashes
      # inside init_db() never binds its port, so its healthcheck (curl -f
      # .../health) never passes — --wait is what turns that into a red job
      # instead of a silent hang.
      - name: Boot the real stack against one shared Postgres, from an empty volume
        run: |
          docker compose --env-file .env.example -f docker-compose.dev.yml \
            up -d --wait --wait-timeout 300 \
            api-gateway clientes produtos estoque vendas financeiro notificacoes empresas

      # --env-file again: compose re-reads the file on every invocation, not
      # just `up`. Without it here, ps/logs/down silently default every
      # ${VAR} to blank and print one "not set" warning per variable — 15+
      # lines of noise that showed up the first time this ran and would bury
      # a real warning the next time something actually breaks.
      - name: Show final health (only reached if the step above passed)
        run: docker compose --env-file .env.example -f docker-compose.dev.yml ps

      # Runs whether the boot above passed or failed. On failure this is the
      # only place the actual migration error shows up — --wait's own message
      # is just "container unhealthy", not why.
      - name: Service logs
        if: always()
        run: docker compose --env-file .env.example -f docker-compose.dev.yml logs --no-color

      # -v: the volume is what "from an empty database" means. Leaving it
      # would make the NEXT run of this same job replay against whatever this
      # run built — silently turning the check back into what prod already is
      # (a stamped schema that migrations never really replay against).
      - name: Tear down
        if: always()
        run: docker compose --env-file .env.example -f docker-compose.dev.yml down -v
