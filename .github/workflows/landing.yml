name: Landing

# The landing is a static site on Cloudflare Pages (project runas-landing,
# serving runaserp.com.br and www). It has nothing to do with the ERP stack:
# no images to build, no containers to restart, no VPS involved. Publishing it
# is an asset upload measured in seconds, so it gets its own trigger instead of
# riding along with a ~15-minute production deploy that cannot ship it anyway.
#
# Mirror image of deploy.yml: that one ignores landing-page/, this one watches
# only landing-page/. A change to either side never wakes the other.
on:
  push:
    branches: [main]
    paths:
      - 'landing-page/**'
  # The manual path stays for a republish without a commit — same reason
  # deploy.yml keeps one.
  workflow_dispatch:

# Unlike deploy-production, a superseded upload is worth cancelling: Pages
# serves whatever finished last, so letting an older run finish after a newer
# one would publish stale content.
concurrency:
  group: landing-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # `wrangler pages deploy` uploads the whole directory it is given and does
      # not read .assetsignore, so it gets a staged copy rather than
      # landing-page/ itself. What must stay out:
      #   .design/source/index.original.html — the entire page duplicated;
      #     indexed, it is duplicate content against the real one
      #   tools/, README.md — repo furniture, not site
      #
      # .image-slots.state.json DOES go: assets/js/image-slot.js fetches it at
      # runtime (STATE_FILE) and it holds the store cover and avatar as base64.
      # Without it those two slots render the dashed "drop an image" placeholder
      # in production. This mirrors tools/deploy.ps1 — keep the two in step.
      - name: Stage the publishable files
        run: |
          mkdir -p dist
          cp landing-page/index.html landing-page/.image-slots.state.json dist/
          cp -r landing-page/assets dist/
          echo "staged:"; find dist -type f | sort

      # --branch main is what makes this a production deployment rather than a
      # preview. Wrangler is pinned to the major it was written against.
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name runas-landing \
            --branch main \
            --commit-dirty=true
