name: Auto-Update Graphify Knowledge Graph

on:
  push:
    branches:
      - main
      - master
      - Developer
    paths:
      - '**.py'
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.jsx'
      - '**.vue'

  workflow_dispatch: # Permite executar manualmente

jobs:
  update-graphify:
    runs-on: ubuntu-latest
    
    # Evita loops infinitos - não roda se o commit for do próprio bot
    if: "!contains(github.event.head_commit.message, '[skip graphify]')"
    
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessário para graphify analisar histórico
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 Instalar Graphify
        run: |
          pip install graphify
          graphify --version
      
      - name: 🔍 Verificar mudanças em código
        id: check-changes
        run: |
          # Verifica se houve mudanças em arquivos de código no último commit
          CODE_CHANGES=$(git diff --name-only HEAD~1 HEAD | grep -E '\.(py|ts|tsx|js|jsx|vue)$' || echo "")
          
          if [ -n "$CODE_CHANGES" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ Detectadas mudanças em código:"
            echo "$CODE_CHANGES"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️  Nenhuma mudança em código detectada"
          fi
      
      - name: 🔄 Atualizar Graphify
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          echo "🔄 Atualizando grafo de conhecimento..."
          graphify update
          echo "✅ Graphify atualizado com sucesso"
      
      - name: 📊 Verificar alterações no grafo
        if: steps.check-changes.outputs.has_changes == 'true'
        id: check-graph-changes
        run: |
          # Verifica se o graphify realmente modificou arquivos
          if [ -n "$(git status --porcelain graphify-out/)" ]; then
            echo "graph_changed=true" >> $GITHUB_OUTPUT
            echo "✅ Grafo foi atualizado, há mudanças para commitar"
            git status --short graphify-out/
          else
            echo "graph_changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️  Grafo já estava atualizado, nenhuma mudança"
          fi
      
      - name: 💾 Commitar grafo atualizado
        if: steps.check-graph-changes.outputs.graph_changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Adiciona apenas arquivos do graphify-out
          git add graphify-out/
          
          # Conta quantos arquivos foram modificados
          MODIFIED_COUNT=$(git diff --cached --numstat | wc -l)
          
          # Commit com mensagem descritiva
          git commit -m "chore(graphify): auto-update knowledge graph [skip graphify]

- Updated by GitHub Actions after code changes
- Modified $MODIFIED_COUNT graphify files
- Triggered by commit: ${{ github.sha }}
- Branch: ${{ github.ref_name }}"
          
          echo "✅ Commit criado com sucesso"
      
      - name: 📤 Push mudanças
        if: steps.check-graph-changes.outputs.graph_changed == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
      
      - name: 📈 Estatísticas do Grafo
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          echo "📊 Estatísticas do Grafo de Conhecimento:"
          echo "=========================================="
          
          if [ -f "graphify-out/graph.json" ]; then
            # Conta nós e edges do grafo
            NODES=$(jq '.nodes | length' graphify-out/graph.json 2>/dev/null || echo "N/A")
            EDGES=$(jq '.edges | length' graphify-out/graph.json 2>/dev/null || echo "N/A")
            
            echo "🔹 Nós (componentes): $NODES"
            echo "🔹 Edges (relações): $EDGES"
          fi
          
          if [ -f "graphify-out/GRAPH_REPORT.md" ]; then
            echo ""
            echo "📄 Relatório disponível em: graphify-out/GRAPH_REPORT.md"
          fi
          
          echo "=========================================="
          echo "✅ Workflow concluído com sucesso!"
