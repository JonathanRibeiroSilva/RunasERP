name: Uptime

# Every health signal that exists today looks from inside the box: the container
# healthcheck curls itself, and Coolify only reads it during a deploy. Docker
# never acts on `unhealthy` either — restart: unless-stopped restarts on exit,
# not on a failed probe — so a container can sit there unhealthy and running.
#
# Coolify's own "Container Status Changes" notification does not close this: the
# ContainerStopped dispatch is commented out at both call sites in
# app/Actions/Docker/GetContainersStatus.php on v4.1.2. Coolify covers the server
# and the deploy; nothing but this covers the application.
on:
  schedule:
    # GitHub throttles scheduled runs hard: with '*/10' the first two real runs
    # landed 32 minutes apart (17:46 and 18:18 UTC, 2026-08-24). Asking for ten
    # minutes is how you get thirty — a tighter cron does not buy a tighter
    # interval, so this stays honest about what it is. Detection here is tens of
    # minutes: good enough while production carries seed data, not good enough
    # the day it carries money. A dedicated uptime service is the upgrade.
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to probe (override to rehearse the alarm)'
        default: 'https://app.runaserp.com.br/api/health/ready'

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      URL: ${{ inputs.url || 'https://app.runaserp.com.br/api/health/ready' }}
    steps:
      # -A is load-bearing: the zone has a WAF rule ("User-Agent suspeito") that
      # challenges any UA containing curl or wget and answers 403 from the edge,
      # without ever reaching the VPS. That is how the old verification step in
      # deploy.yml spent five minutes reading 403s and reporting success. The IP
      # is not the problem — a GitHub runner gets a clean 200 with this UA.
      #
      # /api/health/ready, not /api/health: the latter is liveness and answers
      # 200 with Postgres dead. /ready probes the database, Redis and all seven
      # services, so one request covers tunnel + frontend + gateway + backend,
      # and the 503 body names which one is down.
      #
      # Three attempts, not one: a frontend-only deploy swaps that container and
      # costs ~3s of 502 (measured 2026-08-24). A single shot would page for a
      # deploy doing its job.
      #
      # 3x20s is the whole tolerance, and /ready widened what trips it: a backend
      # deploy now shows 503 for as long as the services take to come back, not
      # just the ~3s of a frontend swap. If deploys start paging, the fix is to
      # skip this run while one is in flight, not to loosen the probe.
      #
      # `|| true` no curl e nao no `code=`: o step roda com `bash -e`, e um
      # timeout do curl sai 28. Sem isso a primeira tentativa lenta matava o
      # step inteiro antes do retry, antes do DOWN= e antes da mensagem de erro
      # — o alarme chegava no Telegram como "sem detalhe" (run de 2026-08-28).
      # Codigo vazio nao e 200, entao a logica de falha segue igual.
      - name: Probe production
        run: |
          for i in 1 2 3; do
            code="$(curl -s -o /tmp/health.json --max-time 10 \
              -A 'Mozilla/5.0 (compatible; RunasUptime/1.0; +github-actions)' \
              -w '%{http_code}' "$URL" || true)"
            echo "attempt $i: $code $(head -c 300 /tmp/health.json)"
            [ "$code" = 200 ] && exit 0
            sleep 20
          done
          # The readiness 503 carries {"down":[...]}. A 502 from nginx carries
          # HTML and the grep finds nothing — the alarm then falls back to the
          # generic text, which is what it always said.
          echo "DOWN=$(grep -o '"down":\[[^]]*\]' /tmp/health.json | head -c 300)" >> "$GITHUB_ENV"
          echo "::error::production unreachable — last status $code"
          exit 1

      # Same bot as Coolify's alerts, so every alarm lands in one place and on a
      # phone. GitHub's own failure email stays as the fallback when the secrets
      # are absent — an alarm nobody sees is the failure mode being avoided here.
      - name: Alert on Telegram
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            echo "TELEGRAM_BOT_TOKEN/CHAT_ID not set — falling back to GitHub's failure email"
            exit 0
          fi
          # printf, not a literal multi-line string: a continuation line at
          # column 0 closes the `run: |` block and the whole file stops parsing.
          detalhe="${DOWN:-sem detalhe: a resposta nao veio do readiness}"
          msg="$(printf '🔴 Runas ERP fora do ar\n%s não respondeu 200 em 3 tentativas.\n%s\n%s' "$URL" "$detalhe" "$RUN")"
          curl -sS -o /dev/null -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            --data-urlencode "chat_id=$CHAT" \
            --data-urlencode "text=$msg"
