<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Sem esta pagina o Pages devolve a home com 200 para qualquer caminho
     inexistente, e cada URL errada que o Google encontra vira uma copia
     indexavel da home. Com ela, o Pages responde 404 de verdade. -->
<meta name="robots" content="noindex">
<title>Página não encontrada — Runas</title>
<style>
  :root { --bg:#080a0f; --text:#e6edf5; --text-2:#94a3b8; --brand-2:#38bdf8; }
  * { box-sizing:border-box }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center;
    justify-content:center; padding:24px; background:var(--bg);
    color:var(--text); text-align:center;
    font-family:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  img { width:180px; max-width:60%; height:auto; margin-bottom:32px }
  h1 {
    font-family:"Archivo","Inter",system-ui,sans-serif;
    font-size:clamp(24px,5vw,34px); line-height:1.2; margin:0 0 12px;
  }
  p { color:var(--text-2); margin:0 0 28px; font-size:16px; line-height:1.6 }
  a {
    color:var(--brand-2); text-decoration:none; font-weight:600;
    border-bottom:1px solid currentColor; padding-bottom:2px;
  }
  a:hover, a:focus-visible { color:#fff }
</style>
</head>
<body>
  <main>
    <img src="/assets/img/brand/runas-white.png" alt="Runas">
    <h1>Essa página não existe</h1>
    <p>O endereço pode ter mudado, ou o link que te trouxe está errado.</p>
    <a href="/">Voltar para a página inicial</a>
  </main>
</body>
</html>
